<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="うごく習慣">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>うごく習慣ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface2:#eef2ee; --ink:#14201c; --sub:#62706b; --line:#e2e8e3;
  --brand:#0d6b5c; --brand2:#2fa37c; --lime:#c7f06b; --brandSoft:#e3f3ec;
  --warn:#c2620f; --warnSoft:#fdf1e4; --bad:#c43a2f; --badSoft:#fdebe9;
  --mini:#8fd1b2; --empty:#e6ebe7;
  --r:22px; --shadow:0 1px 2px rgba(16,40,30,.04),0 8px 24px rgba(16,40,30,.06);
  --heroA:#0d6b5c; --heroB:#1f9a74;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1412;--surface:#17201d;--surface2:#1e2925;--ink:#e9f0ec;--sub:#97a8a1;--line:#26332e;
    --brand:#3cc597;--brand2:#2fa37c;--brandSoft:#18352b;--warn:#f2a463;--warnSoft:#33261a;--bad:#f2867c;--badSoft:#3a1f1c;
    --mini:#2e7d60;--empty:#22302b;--shadow:none;--heroA:#0b4d42;--heroB:#137059}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.65;font-size:15px;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.round{font-family:var(--round)}
h2{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:.01em}
h3{font-size:13px;margin:16px 0 6px;color:var(--sub);font-weight:700}
p{margin:6px 0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--sub);font-size:13px}
.small{font-size:12.5px}
.hide{display:none!important}

/* ---------- top bar ---------- */
.topbar{padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.topbar .wrap{display:flex;align-items:center;gap:10px}
.brandmark{width:30px;height:30px;border-radius:9px;flex:none}
.title{font-family:var(--round);font-weight:900;font-size:18px;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--brandSoft);color:var(--brand);font-weight:700}
.pill.warn{background:var(--warnSoft);color:var(--warn)}
.topbar .pill{margin-left:auto}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .wrap{display:flex;padding:0 6px}
.tabbar button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--sub);font:inherit;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand)}
.tabbar button.on svg{stroke-width:2.3}

/* ---------- cards ---------- */
main{padding-top:8px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
@media (prefers-color-scheme: light){.card{border-color:transparent}}
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-title h2{margin:0}
.sec-title .ic{width:30px;height:30px;border-radius:10px;background:var(--brandSoft);display:grid;place-items:center;font-size:16px;flex:none}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;margin-bottom:14px;
  background:radial-gradient(120% 140% at 100% 0%,rgba(199,240,107,.35) 0%,transparent 45%),linear-gradient(140deg,var(--heroA),var(--heroB));
  box-shadow:0 14px 34px -14px rgba(13,107,92,.55)}
.hero:after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .greet{font-family:var(--round);font-weight:700;font-size:20px}
.hero .date{opacity:.8;font-size:13px}
.hero-main{display:flex;align-items:center;gap:18px;margin-top:14px;position:relative;z-index:1}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .center b{font-family:var(--round);font-size:32px;font-weight:900}
.ring .center span{font-size:11.5px;opacity:.85}
.ring circle{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.hero-side{flex:1;min-width:0}
.hstat{display:flex;align-items:baseline;gap:6px}
.hstat b{font-family:var(--round);font-size:34px;font-weight:900;line-height:1}
.hstat span{font-size:12.5px;opacity:.85}
.dots{display:flex;gap:5px;margin:8px 0 10px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.dots i.f{background:var(--lime)}
.dots i.m{background:rgba(199,240,107,.55)}
.dots i.x{background:transparent;border:2px solid rgba(255,255,255,.35)}
.hsub{font-size:12px;opacity:.85}
.strength{display:inline-flex;gap:4px;align-items:center;font-size:12px;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:999px}

/* ---------- plan / if-then ---------- */
.ifthen{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:var(--surface2);border-radius:16px;padding:12px 14px;margin:6px 0}
.ifthen .k{font-family:var(--round);font-size:11px;font-weight:900;color:#fff;background:var(--brand);border-radius:8px;padding:2px 8px;text-align:center}
.ifthen .k.then{background:var(--brand2)}
.ifthen .k.mini{background:var(--warn)}
.ifthen .v{font-weight:600;font-size:14.5px}
.ifthen.compact{padding:10px 12px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff;box-shadow:0 8px 18px -8px rgba(13,107,92,.7)}
.btn.soft{background:var(--brandSoft);border-color:transparent;color:var(--brand)}
.btn.ghost{background:none;border-color:transparent;color:var(--sub);font-weight:500}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.cta{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:14px}
.cta .btn{padding:18px 10px;font-size:16px;border-radius:18px;flex-direction:column;gap:2px}
.cta .btn small{font-size:11px;font-weight:500;opacity:.85}
.cta .btn .e{font-size:22px;line-height:1}
.links{display:flex;gap:4px;margin-top:6px;justify-content:center;flex-wrap:wrap}

/* ---------- forms ---------- */
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:600}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;background:var(--surface);color:var(--ink);font-family:inherit;font-weight:500}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.days .chip{width:40px;height:40px;padding:0;display:grid;place-items:center;font-weight:700}
.scale{display:flex;gap:4px}
.scale button{flex:1;min-width:0;padding:9px 0;border:0;background:var(--surface2);color:var(--ink);border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.scale button.on{background:var(--brand);color:#fff}
.scalelab{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:3px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:14px;color:var(--ink);margin:6px 0;background:var(--surface2);border-radius:12px;font-weight:500;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--brand)}
.switch{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);margin:0;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer}
.switch:last-child{border-bottom:0}
.switch .t{flex:1}
.switch .t small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.switch input[type=checkbox]{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--empty);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input[type=checkbox]:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input[type=checkbox]:checked{background:var(--brand)}
.switch input[type=checkbox]:checked:after{transform:translateX(18px)}
.switch input[type=time]{width:auto;padding:6px 8px}

/* ---------- notes ---------- */
.note{border-radius:16px;background:var(--brandSoft);padding:12px 14px;font-size:14px;margin:10px 0}
.note.warn{background:var(--warnSoft)}
.note.bad{background:var(--badSoft)}
.note b{color:inherit}
.banner{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px 14px;margin-bottom:14px;background:var(--warnSoft);font-size:14px}
.banner .e{font-size:24px}

/* ---------- stats ---------- */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat>div{background:var(--surface2);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--round);font-size:24px;font-weight:900;line-height:1.2;color:var(--brand)}
.stat span{font-size:11.5px;color:var(--sub)}
.bar{height:10px;background:var(--empty);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:6px}

/* ---------- heatmap ---------- */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:8px;background:var(--empty);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.heat .full{background:var(--brand);color:#fff}
.heat .mini{background:var(--mini);color:#fff}
.heat .rest{background:transparent;border:1.5px dashed var(--line)}
.heat .today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand2)}
.heat .wd{background:none;aspect-ratio:auto;font-size:11px;font-weight:700}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
svg text{fill:var(--sub);font-size:10px}

.list{list-style:none;padding:0;margin:0}
.list li{display:flex;gap:8px;align-items:center;padding:4px 0}
.x{margin-left:auto;background:var(--surface2);border:0;color:var(--sub);cursor:pointer;font-size:14px;width:30px;height:30px;border-radius:50%;flex:none}

/* ---------- done state ---------- */
.done{text-align:center;padding:6px 0 4px}
.done .badge{width:76px;height:76px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:linear-gradient(140deg,var(--brandSoft),color-mix(in srgb,var(--lime) 40%,var(--brandSoft)))}
.done h2{font-size:20px;margin:4px 0}

/* ---------- onboarding ---------- */
.ob{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 0 30px}
.steps{display:flex;gap:5px;margin:4px 0 18px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--brand),var(--brand2))}
.ob h1{font-size:25px;line-height:1.35;margin:0 0 8px;font-weight:900}
.ob .lead{color:var(--sub);margin-bottom:16px}
.welcome{text-align:center;padding-top:7vh}
.welcome .logo{width:96px;height:96px;border-radius:28px;margin:0 auto 18px;box-shadow:0 18px 40px -16px rgba(13,107,92,.7);display:block}
.welcome h1{font-size:30px}
.feat{display:grid;gap:10px;margin:22px 0;text-align:left}
.feat div{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px}
.feat .e{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--brandSoft);display:grid;place-items:center;flex:none}
.obnav{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.obnav .btn{width:100%;padding:16px;font-size:16px;border-radius:18px}

/* ---------- sheets / toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:90%;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(8,20,16,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.modal .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@media(min-width:620px){.modal{align-items:center}.modal .sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* ---------- confetti ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.ring circle{transition:none}.modal .sheet{animation:none}}
</style>
</head>
<body>
<header class="topbar hide" id="topbar"><div class="wrap">
  <svg class="brandmark" viewBox="0 0 512 512"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d6b5c"/><stop offset="1" stop-color="#2fa37c"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#bm)"/><circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="34"/><path d="M256 106a150 150 0 0 1 142 102" fill="none" stroke="#d9f99d" stroke-width="34" stroke-linecap="round"/><path d="M196 262l44 44 84-96" fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="title" id="pageTitle">うごく習慣ラボ</div>
  <span class="pill" id="phaseBadge"></span>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabbar hide" id="nav"><div class="wrap">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>今日</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>記録</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>プラン</button>
  <button data-tab="habit"><svg viewBox="0 0 24 24"><path d="M12 21c-5-3-8-7-8-11a8 8 0 0 1 16 0c0 4-3 8-8 11z"/><path d="M12 21V9"/><path d="M12 13l-3-3M12 11l3-3"/></svg>習慣度</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   うごく習慣ラボ — 運動習慣化のための行動変容ツール
   データはすべてこの端末の localStorage に保存（外部送信なし）
   ========================================================= */
const KEY='ugoku-habit-v1';
const DOW=['日','月','火','水','木','金','土'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayStr=()=>ymd(new Date());
const weekStart=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x}; // 月曜始まり
const toMin=t=>{const[a,b]=(t||'0:0').split(':').map(Number);return a*60+b};

const SAFETY_Q=[
 {id:'heart',t:'医師から心臓の病気や高血圧を指摘され、運動は医療者の管理下でと言われている'},
 {id:'chest',t:'安静時や運動時に胸の痛み・圧迫感がある'},
 {id:'dizzy',t:'めまいでふらつく、または最近意識を失ったことがある'},
 {id:'treat',t:'現在、化学療法・放射線療法・分子標的薬などの治療中、または治療終了後3か月以内'},
 {id:'surgery',t:'最近（おおむね8週以内）手術を受けた／傷が治りきっていない'},
 {id:'bone',t:'骨転移・骨粗しょう症など、骨がもろいと言われている'},
 {id:'blood',t:'血球減少（貧血・白血球や血小板の低下）や発熱を指摘されている'},
 {id:'lymph',t:'リンパ浮腫がある、または腕や脚のむくみが急に強くなった'},
 {id:'neuro',t:'しびれ（末梢神経障害）やバランスの悪さで転びそうになる'},
 {id:'other',t:'その他、医療者から運動を制限されている理由がある'},
];
const RED_FLAGS=['胸の痛み・圧迫感','強い息切れ（会話できない）','めまい・ふらつき・失神しそう','動悸・脈が乱れる感じ','38℃以上の発熱','いつもと違う出血・あざ','新しい／強くなった骨の痛み','腕や脚の急なむくみ・痛み'];

/* ---------- 計算 ---------- */
const riskCount=()=>Object.values(S.safety.answers).filter(v=>v===true).length;
const hiitAllowed=()=>riskCount()===0||S.safety.clearance;
const isPlanned=d=>S.plan.days.includes(d.getDay());
const doneOf=s=>{const l=S.logs[s];return l&&(l.status==='full'||l.status==='mini')};

// 「2回続けて休まない」ルールの連続記録：単発の休みは許容、予定日の未実施が2回続くとリセット
function chain(){
  let count=0,misses=0,forgiven=0,d=new Date();d.setHours(0,0,0,0);
  const start=parse(S.created);
  if(!doneOf(ymd(d)))d=addDays(d,-1); // 今日の未記録はまだ途中
  let guard=0;
  while(d>=start&&guard<800){guard++;
    const s=ymd(d);
    if(doneOf(s)){count++;if(misses===1&&count>1)forgiven++;misses=0}
    else if(isPlanned(d)){misses++;if(misses>=2)break}
    d=addDays(d,-1);
  }
  return {count,forgiven};
}
// 直近7回の予定日の結果（ヒーローのドット表示用）
function recentPlanned(){
  const out=[];let d=new Date();d.setHours(0,0,0,0);const start=parse(S.created);let g=0;
  while(out.length<7&&g<60){g++;const s=ymd(d),l=S.logs[s];
    if(isPlanned(d)||doneOf(s)){
      if(d<start)out.push('');
      else if(l&&l.status==='full')out.push('f');else if(l&&l.status==='mini')out.push('m');
      else if(s===todayStr())out.push('');else out.push('x');}
    d=addDays(d,-1)}
  return out.reverse();
}
function weekStats(ws){
  let min=0,days=0,str=0,full=0,mini=0,planned=0;
  for(let i=0;i<7;i++){const d=addDays(ws,i),s=ymd(d),l=S.logs[s];
    if(isPlanned(d))planned++;
    if(l&&(l.status==='full'||l.status==='mini')){days++;min+=Number(l.min)||0;if(l.status==='full')full++;else mini++;
      if(exOf(l.type).str||l.strength)str++;}}
  return{min,days,str,full,mini,planned};
}
function phase(){
  const weeks=Math.floor((Date.now()-parse(S.created))/864e5/7);
  const sr=S.srbai.length?S.srbai[S.srbai.length-1]:null;
  if(sr&&sr.mean>=5.5&&weeks>=8)return{n:'維持期',e:'🌳',d:'行動がかなり自動化しています。崩れたときの立て直しプランを磨きましょう。'};
  if(weeks>=3||(sr&&sr.mean>=4))return{n:'形成期',e:'🌿',d:'きっかけ→行動のつながりが育っている時期。同じきっかけ・同じ場所を続けるほど強くなります。'};
  return{n:'開始期',e:'🌱',d:'まずは「小さく・確実に」。量より、決めたきっかけで毎回始めることが大切です。'};
}
// 段階的目標調整（成功体験ベース）
function progressionAdvice(){
  const ws=weekStart(new Date());
  const w1=weekStats(addDays(ws,-7)),w2=weekStats(addDays(ws,-14));
  const g=S.plan.weeklyGoal;
  const recent=Object.entries(S.logs).filter(([k])=>parse(k)>=addDays(ws,-14)&&parse(k)<ws).map(([,v])=>v);
  const rpes=recent.map(l=>Number(l.rpe)).filter(n=>n>0);
  const avgRpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  if(Object.keys(S.logs).length<5)return null;
  if(recent.some(l=>l.flags&&l.flags.length))return{kind:'hold',msg:'最近、注意が必要な症状の記録があります。目標は据え置き、医療者に相談してから増やしましょう。'};
  if(w1.min>=g&&w2.min>=g&&(avgRpe===null||avgRpe<=6)&&g<300){
    const next=Math.min(300,Math.round((g*1.15)/5)*5||g+5);
    return{kind:'up',next,msg:`2週続けて目標（週${g}分）を達成し、きつさも適度です。週${next}分に少しだけ上げてみませんか？`};
  }
  if(w1.min<g*0.5&&w2.min<g*0.5&&g>15){
    const next=Math.max(10,Math.round((Math.max(w1.min,w2.min,g*0.6))/5)*5);
    return{kind:'down',next,msg:`ここ2週は目標の半分未満でした。失敗ではなく「目標が大きすぎた」サインです。週${next}分にして、確実に達成する体験を積みましょう。`};
  }
  return null;
}

/* ---------- 共通UI部品 ---------- */
function scale(name,val,min,max,labL,labR){
  let h=`<div class="scale" data-scale="${name}">`;
  for(let i=min;i<=max;i++)h+=`<button type="button" data-v="${i}" class="${val!=null&&Number(val)===i?'on':''}">${i}</button>`;
  return h+`</div><div class="scalelab"><span>${labL}</span><span>${labR}</span></div>`;
}
function bindScales(root,obj){
  root.querySelectorAll('[data-scale]').forEach(el=>{
    el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      obj[el.dataset.scale]=Number(b.dataset.v);});
  });
}
function modal(html,onMount){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  m.addEventListener('click',e=>{if(e.target===m)m.remove()});
  document.body.appendChild(m);onMount&&onMount(m.querySelector('.sheet'),()=>m.remove());return m;
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('div');c.className='confetti';
  const cols=['#0d6b5c','#2fa37c','#c7f06b','#ffd166','#7dd3c0','#f4a261'];
  for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    p.style.animationDelay=(Math.random()*.25)+'s';p.style.animationDuration=(1.2+Math.random()*.9)+'s';c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2600);
}
function ifthenBlock(p,compact){
  return `<div class="ifthen ${compact?'compact':''}"><span class="k">IF</span><span class="v">${esc(p.anchor||'（きっかけ）')}</span>
   <span class="k then">THEN</span><span class="v">${exOf(p.type).e} ${p.place?esc(p.place)+'で ':''}${esc(p.behavior)}を${p.minutes}分${p.time?` <span class="muted small">${esc(p.time)}ごろ</span>`:''}</span>
   <span class="k mini">MINI</span><span class="v" style="font-weight:500">${esc(p.mini)}</span></div>`;
}

    };return;
  }
  next.onclick=()=>{if(st===2)S.profile.why=$('#why').value.trim();ob.step++;save();renderOnboarding()};
}

  on('hard',hardDay);on('review',reviewSheet);on('nOn',()=>notifOffer());on('inst',installApp);on('instX',()=>{S.installDismissed=true;save();render()});
  on('advYes',()=>{S.plan.weeklyGoal=adv.next;S.lastProgressCheck=wsKey;save();toast(`週${adv.next}分に更新しました`);render()});

}

  const L=Object.assign({status,min:status==='mini'?Math.min(5,p.minutes):p.minutes,type:p.type,rpe:null,moodBefore:null,moodAfter:null,flags:[],note:'',strength:false},ex||{},{status});

    <div><label>運動後の気分</label>${scale('moodAfter',L.moodAfter,1,5,'😞','😄')}</div></div>
    <label>気になった症状（あれば）</label>
    <div class="chips" id="flags">${RED_FLAGS.map(f=>`<button type="button" class="chip ${L.flags.includes(f)?'on':''}">${f}</button>`).join('')}</div>

    const fm=()=>{sh.querySelector('#flagMsg').innerHTML=L.flags.length?`<div class="note bad">これらの症状があるときは運動を中止して休んでください。治まらない・強い場合は医療者に連絡を。胸の痛みや失神しそうな場合は救急要請を検討してください。</div>`:''};
    sh.querySelector('#flags').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;b.classList.toggle('on');const v=b.textContent;L.flags=b.classList.contains('on')?[...L.flags,v]:L.flags.filter(x=>x!==v);fm()};fm();
    sh.querySelector('#saveLog').onclick=()=>{
      L.type=sh.querySelector('#ltype').value;L.min=Math.max(0,Number(sh.querySelector('#lmin').value)||0);

      const first=!doneOf(t);S.logs[t]=L;

      save();close();

      if(first){confetti();toast(c>1?`記録しました。連続${c}回目！`:'記録しました。最初の一歩です！')}else toast('更新しました');
      if(first&&[7,14,30,50,66,100].includes(c))setTimeout(()=>modal(`<div class="done"><div class="badge">🏅</div><h2>連続${c}回達成</h2><p>${c>=66?'研究では、習慣の自動化にかかる日数の中央値は約66日と報告されています。ここまで来たあなたの行動は、かなり「自分の一部」になっています。':'積み重ねが、きっかけと行動の結びつきを強くしています。'}</p><button class="btn pri" onclick="this.closest('.modal').remove()">ありがとう</button></div>`),700);

}

   記録（フィードバック）

function renderProgress(){
  const now=new Date(),ws=weekStart(now);
  const weeks=[];for(let i=7;i>=0;i--){const s=addDays(ws,-7*i);weeks.push({s,...weekStats(s)})}
  const goal=S.plan.weeklyGoal,maxV=Math.max(goal*1.25,...weeks.map(w=>w.min),10);
  const W=520,H=190,pl=30,pb=24,bw=(W-pl)/8;
  const y=v=>H-pb-(v/maxV)*(H-pb-16);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="週ごとの運動時間"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand2)"/><stop offset="1" stop-color="var(--brand)"/></linearGradient></defs>`;
  weeks.forEach((w,i)=>{const x=pl+i*bw+bw*.2,bh=H-pb-y(w.min),cur=i===7;
    svg+=`<rect x="${x}" y="${y(w.min)}" width="${bw*.6}" height="${Math.max(0,bh)}" rx="7" fill="${w.min>=goal?'url(#bg1)':'var(--mini)'}" opacity="${cur?1:.92}"><title>${w.min}分</title></rect>`;
    svg+=`<text x="${x+bw*.3}" y="${H-7}" text-anchor="middle" style="${cur?'font-weight:700;fill:var(--ink)':''}">${cur?'今週':`${w.s.getMonth()+1}/${w.s.getDate()}`}</text>`;
    if(w.min)svg+=`<text x="${x+bw*.3}" y="${y(w.min)-5}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${w.min}</text>`;});
  svg+=`<line x1="${pl}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${pl-3}" y="${y(goal)+3}" text-anchor="end" style="fill:var(--warn);font-weight:700">目標</text></svg>`;
  let heat=`<div class="heat">${['月','火','水','木','金','土','日'].map(d=>`<div class="wd">${d}</div>`).join('')}`;
  const hs=addDays(ws,-7*11);
  for(let i=0;i<84;i++){const d=addDays(hs,i),s=ymd(d),l=S.logs[s];
    let c='';if(l&&l.status==='full')c='full';else if(l&&l.status==='mini')c='mini';else if(!isPlanned(d))c='rest';
    const out=d>now||d<parse(S.created);if(out&&!l)c='rest';
    heat+=`<div class="${c} ${s===todayStr()?'today':''}" title="${s}" style="${out?'opacity:.3':''}">${d.getDate()}</div>`}
  heat+='</div>';
  const moods=Object.values(S.logs).filter(l=>l.moodBefore&&l.moodAfter);
  const up=moods.filter(l=>l.moodAfter>l.moodBefore).length;
  const avgDelta=moods.length?(moods.reduce((a,l)=>a+(l.moodAfter-l.moodBefore),0)/moods.length):0;
  const tot=Object.values(S.logs).filter(l=>l.status==='full'||l.status==='mini');
  const totalMin=tot.reduce((a,l)=>a+(Number(l.min)||0),0);
  const ch=chain();
  let pd=0,pdDone=0;for(let i=1;i<=28;i++){const d=addDays(now,-i);if(d<parse(S.created))break;if(isPlanned(d)){pd++;if(doneOf(ymd(d)))pdDone++}}
  const rate=pd?Math.round(pdDone/pd*100):null;
  let h=`<div class="card"><div class="sec-title"><span class="ic">🏔️</span><h2>これまでの積み重ね</h2></div><div class="stat">
    <div><b>${tot.length}</b><span>実施回数</span></div><div><b>${totalMin}</b><span>合計（分）</span></div><div><b>${rate===null?'—':rate+'%'}</b><span>予定日の実施率</span></div></div>
    ${ch.forgiven?`<p class="muted small" style="margin-top:10px">連続${ch.count}回のうち、単発のお休み${ch.forgiven}回は「2回続けて休まない」ルールで許容されています。</p>`:''}</div>
  <div class="card"><div class="sec-title"><span class="ic">📊</span><h2>週ごとの運動時間</h2></div>${svg}<p class="muted small">濃い緑＝目標達成。目標は達成状況に合わせて調整されます（開始時 週${S.plan.startGoal}分 → 現在 週${goal}分）。</p></div>

  if(moods.length)h+=`<div class="card"><div class="sec-title"><span class="ic">😊</span><h2>運動と気分</h2></div><p>気分を記録した${moods.length}回のうち <b>${up}回</b> で、運動後に気分が上がりました（平均 ${avgDelta>=0?'+':''}${avgDelta.toFixed(1)}）。</p><p class="muted small">運動の「すぐ得られるごほうび」に気づくことが、続ける力になります。</p></div>`;
  if(S.wins.length)h+=`<div class="card"><div class="sec-title"><span class="ic">💡</span><h2>成功のコツ集</h2></div>${S.wins.slice(-8).reverse().map(w=>`<div class="note small" style="margin:6px 0"><b>${esc(w.date.slice(5).replace('-','/'))}</b>　${esc(w.text)}</div>`).join('')}</div>`;
  $('#app').innerHTML=h;
}

}

/* =========================================================
   通知・インストール
   - サーバーあり（Cloudflare に公開時）：Web Push で、アプリを閉じていても時刻どおりに届く
   - サーバーなし：アプリを開いている間のタイマー＋（対応環境のみ）定期バックグラウンド確認
   - 通知の「やった！」「ミニ版」ボタンは、アプリを開かずに記録できる
   ========================================================= */
// 通知サーバーのURL。空なら同じサイトの /api を使う（Cloudflare版）。
// GitHub Pages で使う場合は、Cloudflare に公開した通知サーバーのURL（例 https://ugoku-habit.xxx.workers.dev/）を入れる。
const PUSH_API='';
const API=p=>(PUSH_API?PUSH_API.replace(/\/?$/,'/'):'')+'api/'+p;
let swReg=null,timers=[],SERVER=null,installEvt=null,pushTimer=null;
const swOK=()=>'serviceWorker' in navigator&&location.protocol.startsWith('http');
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Tokyo'}catch(e){return'Asia/Tokyo'}})();
const pushOn=()=>!!(SERVER&&S.notif.enabled&&S.notif.endpoint);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(S.onboarded&&tab==='today'&&!document.querySelector('.modal'))render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('ホーム画面に追加しました')});

async function registerSW(){
  if(!swOK())return;
  try{swReg=await navigator.serviceWorker.register('sw.js');
    navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.do)handleAction(d.do);if(d.pending)applyPending()});
  }catch(e){console.warn('SW登録に失敗',e)}
  try{const r=await fetch(API('vapid'),{cache:'no-store'});if(r.ok){const j=await r.json();if(j.publicKey&&j.publicKey.length>60)SERVER=j}}catch(e){}
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ugoku',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbPut(k,v){try{const d=await idb();await new Promise(res=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=res})}catch(e){}}
// 通知ボタンから記録された分をアプリに反映
async function applyPending(){
  const pend=await idbGet('pending');if(!pend||!pend.length)return;
  let n=0;pend.forEach(p=>{if(!doneOf(p.date)){S.logs[p.date]={status:p.status,min:p.min,type:p.type,date:p.date,via:'notification',rpe:null,moodBefore:null,moodAfter:null,flags:[],note:''};n++}});
  await idbPut('pending',[]);
  if(n){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncSchedule();toast(`通知から記録した${n}回分を反映しました`);if(!document.querySelector('.modal'))render()}
}
function schedulePayload(){
  const p=S.plan,n=S.notif;
  const lastDone=Object.keys(S.logs).filter(doneOf).sort().pop()||'';
  const lastRest=Object.keys(S.logs).filter(k=>S.logs[k].status==='rest').sort().pop()||'';
  return{tz:TZ,days:p.days,cue:n.cue,cueTime:n.cueTime||p.time,nudge:n.nudge,nudgeTime:n.nudgeTime,review:n.review,
    anchor:p.anchor,behavior:p.behavior,minutes:p.minutes,mini:p.mini,type:p.type,lastDone,lastRest};
}
function syncSchedule(){
  if(!window.indexedDB)return;
  const n=S.notif,perm='Notification' in window?Notification.permission:'denied';
  idbPut('sched',{...schedulePayload(),enabled:n.enabled&&perm==='granted',server:pushOn(),endpoint:n.endpoint||'',api:API('done')});
  if(pushOn()){clearTimeout(pushTimer);pushTimer=setTimeout(pushSync,800)}
}
async function pushSync(){
  try{const sub=swReg&&await swReg.pushManager.getSubscription();if(!sub)return;
    await fetch(API('subscribe'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),schedule:schedulePayload()})});
  }catch(e){}
}
async function notify(title,body,tag){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  const opt={body,tag:'ugoku-'+tag,renotify:true,icon:'icon-192.png',badge:'icon-192.png'};
  try{
    if(swReg){await swReg.showNotification(title,{...opt,actions:tag==='cue'||tag==='nudge'?[{action:'full',title:'✓ やった！'},{action:'mini',title:'🌱 ミニ版'}]:[],data:{kind:tag,date:todayStr()}});return true}
    const nt=new Notification(title,opt);nt.onclick=()=>{window.focus();nt.close()};return true;
  }catch(e){console.warn(e);return false}
}
// サーバーがない場合：アプリ（タブ）が開いている間は時刻ちょうどに通知
function scheduleLocal(){
  timers.forEach(clearTimeout);timers=[];
  const n=S.notif,p=S.plan;if(!n.enabled||pushOn())return;
  const now=new Date(),m=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const add=(time,fn)=>{if(!time)return;const diff=(toMin(time)-m)*60000;if(diff>0&&diff<864e5)timers.push(setTimeout(fn,diff))};
  const settled=()=>{const l=S.logs[todayStr()];return l&&(l.status!=='')};
  if(isPlanned(now)){
    n.cue&&add(n.cueTime||p.time,()=>{if(!settled())notify(`もし「${p.anchor}」なら…`,`${p.behavior}を${p.minutes}分。しんどい日は「${p.mini}」だけでOK`,'cue')});
    n.nudge&&add(n.nudgeTime,()=>{if(!settled())notify('今日はまだ記録がありません',`ミニ版「${p.mini}」だけでも、連続記録はつながります`,'nudge')});
  }
  if(now.getDay()===0&&n.review)add('19:00',()=>notify('週のふり返りの時間です','3分で今週をふり返り、来週のプランを整えましょう','review'));
  const mid=new Date(now);mid.setHours(24,0,5,0);timers.push(setTimeout(()=>{scheduleLocal();render()},mid-now));
}
async function enablePeriodic(){
  try{if(!swReg||!('periodicSync' in swReg))return false;
    const st=await navigator.permissions.query({name:'periodic-background-sync'});if(st.state!=='granted')return false;
    await swReg.periodicSync.register('ugoku-check',{minInterval:60*60*1000});return true}catch(e){return false}
}
function notifEnv(){
  if(isIOS&&!isStandalone())return{ok:false,ios:true,msg:'iPhoneでは、まず「ホーム画面に追加」して、ホーム画面のアイコンから開くと通知をオンにできます。'};
  if(!('Notification' in window))return{ok:false,msg:'このブラウザは通知に対応していません。「カレンダーに登録」を使うと確実にお知らせが届きます。'};
  if(!SERVER){
    if(location.protocol==='file:')return{ok:true,limited:true,msg:'ファイルとして開いているため、通知は「このページを開いている間」だけ届きます。公開版のURLから使うと、閉じていても届きます。'};
    return{ok:true,limited:true,msg:'通知サーバーに接続できないため、通知は主にアプリを開いている間に届きます。'};
  }
  return{ok:true};
}
function b64uToBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function turnOnNotif(){
  const env=notifEnv();
  if(!env.ok){if(env.ios)installGuide();else toast(env.msg);return false}
  let perm=Notification.permission;
  if(perm==='default'){try{perm=await Notification.requestPermission()}catch(e){}}
  if(perm!=='granted'){toast('通知が許可されませんでした（ブラウザ・端末の設定で許可できます）');S.notif.enabled=false;save();return false}
  S.notif.enabled=true;S.notif.dismissed=true;
  let mode='local';
  if(SERVER&&swReg){
    try{
      let sub=await swReg.pushManager.getSubscription();
      if(sub&&sub.options&&sub.options.applicationServerKey){const k=new Uint8Array(sub.options.applicationServerKey);const want=b64uToBytes(SERVER.publicKey);if(k.length!==want.length||k.some((x,i)=>x!==want[i])){await sub.unsubscribe();sub=null}}
      if(!sub)sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(SERVER.publicKey)});
      S.notif.endpoint=sub.endpoint;
      const r=await fetch(API('subscribe'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),schedule:schedulePayload()})});
      if(r.ok)mode='push';else S.notif.endpoint='';
    }catch(e){console.warn('push購読に失敗',e);S.notif.endpoint=''}
  }
  save();scheduleLocal();
  if(mode==='local')await enablePeriodic();
  notify('通知をオンにしました',mode==='push'?`${S.notif.cueTime||S.plan.time}ごろにお知らせします。アプリを閉じていても届きます`:`${S.notif.cueTime||S.plan.time}ごろにお知らせします`,'test');
  toast(mode==='push'?'通知をオンにしました（閉じていても届きます）':'通知をオンにしました');
  return true;
}
async function turnOffNotif(){
  S.notif.enabled=false;
  try{const sub=swReg&&await swReg.pushManager.getSubscription();if(sub){fetch(API('unsubscribe'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});await sub.unsubscribe()}}catch(e){}
  S.notif.endpoint='';save();scheduleLocal();toast('通知をオフにしました');
}
function notifOffer(){
  const env=notifEnv();
  if(env.ios)return installGuide(true);
  modal(`<div class="done"><div class="badge">🔔</div><h2>きっかけの時間にお知らせ</h2></div>
    <p>「もし〇〇なら」の時間に通知が届きます。通知の<b>「やった！」「ミニ版」</b>を押すだけで、アプリを開かずに記録できます。</p>
    ${env.ok?'':`<div class="note warn">${esc(env.msg)}</div>`}
    ${env.limited?`<div class="note warn small">${esc(env.msg)}</div>`:''}
    <label>通知する時刻</label><input type="time" id="nt" value="${esc(S.notif.cueTime||S.plan.time||'08:00')}">
    <div class="cta"><button class="btn pri" id="yes" ${env.ok?'':'disabled'}><span class="e">🔔</span>オンにする</button><button class="btn" id="cal"><span class="e">📅</span>カレンダー登録</button></div>
    <div class="links"><button class="btn ghost sm" id="later">あとで</button></div>`,
  (sh,close)=>{
    sh.querySelector('#yes').onclick=async()=>{S.notif.cueTime=sh.querySelector('#nt').value;if(!S.plan.time)S.plan.time=S.notif.cueTime;await turnOnNotif();close();render()};
    sh.querySelector('#cal').onclick=()=>{downloadICS()};
    sh.querySelector('#later').onclick=()=>{S.notif.dismissed=true;save();close();render()};
  });
}
function canInstall(){return !isStandalone()&&(installEvt||isIOS)}
async function installApp(){
  if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render();return}
  installGuide();
}
function installGuide(forNotif){
  modal(`<div class="done"><div class="badge">📲</div><h2>ホーム画面に追加</h2></div>
    <p>${forNotif?'iPhoneで通知を受け取るには、まずアプリをホーム画面に追加します。':'アプリのように、ワンタップで開けるようになります。'}</p>
    ${isIOS?`<div class="ifthen compact" style="grid-template-columns:auto 1fr"><span class="k">1</span><span class="v" style="font-weight:500">Safariの下にある <b>共有ボタン</b>（□に↑）をタップ</span>
     <span class="k">2</span><span class="v" style="font-weight:500"><b>「ホーム画面に追加」</b>を選んで「追加」</span>
     <span class="k">3</span><span class="v" style="font-weight:500">ホーム画面の <b>うごく習慣</b> アイコンから開く</span>
     <span class="k">4</span><span class="v" style="font-weight:500">「今日」画面の <b>通知をオンにする</b> をタップ</span></div>
     <p class="muted small">Safari以外（Chromeなど）で開いている場合は、Safariでこのページを開いてください。記録はブラウザごとに保存されるため、ホーム画面のアプリで最初から設定するか、設定タブの書き出し／読み込みで移してください。</p>`
    :`<p class="muted small">ブラウザのメニュー（︙）から「アプリをインストール」または「ホーム画面に追加」を選んでください。</p>`}
    <button class="btn pri block" id="ok" style="margin-top:12px">わかった</button>`,(sh,close)=>{sh.querySelector('#ok').onclick=close});
}
function handleAction(a){
  if(!S.onboarded)return;
  go('today');
  if(a==='full'||a==='mini'||a==='log')setTimeout(()=>{if(!doneOf(todayStr()))logSheet(a==='mini'?'mini':'full')},200);
  if(a==='review')setTimeout(reviewSheet,200);
}

/* =========================================================
   設定
   ========================================================= */
function renderSettings(){
  const n=riskCount(),N=S.notif,env=notifEnv();
  const perm='Notification' in window?Notification.permission:'unsupported';
  $('#app').innerHTML=`<div class="card"><div class="sec-title"><span class="ic">🔔</span><h2>通知</h2></div>
    ${env.ok&&!env.limited?'':`<div class="note warn small">${esc(env.msg)}</div>`}
    ${perm==='denied'?'<div class="note bad small">ブラウザで通知がブロックされています。サイトの設定から許可してください。</div>':''}
    <label class="switch"><span class="t">通知を使う<small>${N.enabled?(pushOn()?'オン（閉じていても届く）':'オン（開いている間）'):'オフ'}・許可状態：${({granted:'許可済み',denied:'ブロック',default:'未設定',unsupported:'非対応'})[perm]}</small></span><input type="checkbox" id="nEn" ${N.enabled?'checked':''}></label>
    <div id="nOpts" class="${N.enabled?'':'hide'}">
    <label class="switch"><span class="t">きっかけの時間<small>予定日に、if-thenプランをお知らせ</small></span><input type="time" id="nCueT" value="${esc(N.cueTime||S.plan.time)}"><input type="checkbox" id="nCue" ${N.cue?'checked':''}></label>
    <label class="switch"><span class="t">未記録のときの声かけ<small>予定日にまだ記録がなければ</small></span><input type="time" id="nNudT" value="${esc(N.nudgeTime)}"><input type="checkbox" id="nNud" ${N.nudge?'checked':''}></label>
    <label class="switch"><span class="t">週のふり返り<small>日曜 19:00</small></span><input type="checkbox" id="nRev" ${N.review?'checked':''}></label>
    <button class="btn sm soft" id="nTest" style="margin-top:10px">テスト通知を送る</button></div>
    <p class="muted small" style="margin-top:10px">確実に届けたいときは、プランタブの「📅 カレンダーに登録」も併用してください（スマホのカレンダーのアラームで届きます）。</p></div>
  ${canInstall()?`<div class="card"><div class="sec-title"><span class="ic">📲</span><h2>ホーム画面に追加</h2></div><p class="small">アプリのようにワンタップで開けて、通知も届きやすくなります。</p><button class="btn sm pri" id="inst">追加する</button></div>`:''}
  <div class="card"><div class="sec-title"><span class="ic">🩺</span><h2>安全チェック</h2></div>
    <p>該当項目：<b>${n}</b> 件（${esc(S.safety.date||'未実施')}）</p>
    ${n?`<label class="check"><input type="checkbox" id="clr" ${S.safety.clearance?'checked':''}>医療者から運動（高強度を含む）の許可を得ている</label>`:''}
    <button class="btn sm" id="resafe" style="margin-top:6px">安全チェックをやり直す</button>
    <p class="muted small">体調や治療内容が変わったら、やり直してください。</p></div>
  <div class="card"><div class="sec-title"><span class="ic">💾</span><h2>データ</h2></div><p class="muted small">データはこの端末・このブラウザにのみ保存されています。機種変更や研究データの提出には書き出しを使ってください。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="exp">JSONで書き出し</button><button class="btn sm" id="csv">CSVで書き出し</button><label class="btn sm" style="margin:0;color:var(--ink)">読み込み<input type="file" id="imp" accept=".json" class="hide"></label></div></div>
  <div class="card"><div class="sec-title"><span class="ic">⚠️</span><h2>リセット</h2></div><button class="btn sm danger" id="reset">すべてのデータを消去</button></div>
  <p class="muted small" style="text-align:center;padding:0 10px">行動変容技法（BCT Taxonomy v1）、COM-Bモデル、実行意図、習慣形成理論にもとづいて設計。医療上の助言の代わりにはなりません。</p>`;
  const c=$('#clr');c&&(c.onchange=()=>{S.safety.clearance=c.checked;save();toast('更新しました')});
  $('#nEn').onchange=async e=>{if(e.target.checked){const ok=await turnOnNotif();if(!ok)e.target.checked=false}else{await turnOffNotif()}renderSettings()};
  const bindN=(id,key,prop='checked')=>{const el=$('#'+id);el&&(el.onchange=()=>{S.notif[key]=el[prop];save();scheduleLocal();toast('更新しました')})};
  bindN('nCue','cue');bindN('nNud','nudge');bindN('nRev','review');bindN('nCueT','cueTime','value');bindN('nNudT','nudgeTime','value');
  const tb=$('#nTest');tb&&(tb.onclick=async()=>{let ok=false;
    if(pushOn()){try{const r=await fetch(API('test'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:S.notif.endpoint})});ok=r.ok;toast(ok?'サーバーから送信しました（数秒で届きます）':'送信に失敗しました。通知をいったんオフ→オンにしてください');return}catch(e){}}
    ok=await notify('テスト通知',`もし「${S.plan.anchor}」なら、${S.plan.behavior}を${S.plan.minutes}分`,'test');toast(ok?'送信しました':'通知を送れませんでした')});
  const ib=$('#inst');ib&&(ib.onclick=installApp);
  $('#resafe').onclick=()=>modal(`<h2>安全チェック</h2>${SAFETY_Q.map(q=>`<label class="check"><input type="checkbox" data-q="${q.id}" ${S.safety.answers[q.id]?'checked':''}>${esc(q.t)}</label>`).join('')}<button class="btn pri block" id="ok" style="margin-top:12px">保存</button>`,(sh,close)=>{sh.querySelector('#ok').onclick=()=>{sh.querySelectorAll('[data-q]').forEach(x=>S.safety.answers[x.dataset.q]=x.checked);S.safety.date=todayStr();if(riskCount()===0)S.safety.clearance=false;save();close();render()}});
  const dl=(name,data,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()};
  $('#exp').onclick=()=>dl(`habit-backup-${todayStr()}.json`,JSON.stringify(S,null,2),'application/json');
  $('#csv').onclick=()=>{const rows=[['date','status','minutes','type','strength','rpe','mood_before','mood_after','symptoms','note']];
    Object.keys(S.logs).sort().forEach(k=>{const l=S.logs[k];rows.push([k,l.status,l.min??'',l.type??'',l.strength?1:0,l.rpe??'',l.moodBefore??'',l.moodAfter??'',(l.flags||[]).join('|'),l.note??''])});
    S.srbai.forEach(r=>rows.push([r.date,'srbai',r.mean,'','','','','','',r.items.join('|')]));
    dl(`habit-logs-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv')};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.plan||!d.logs)throw 0;localStorage.setItem(KEY,JSON.stringify(d));S=load();save();toast('読み込みました');render()}catch(_){toast('ファイルを読み込めませんでした')}};r.readAsText(f)};
  $('#reset').onclick=()=>modal(`<h2>本当に消去しますか？</h2><p>記録・プラン・ふり返りがすべて消え、元に戻せません。必要なら先に書き出してください。</p><div class="cta"><button class="btn" id="no">やめる</button><button class="btn pri" id="yes" style="background:var(--bad)">消去する</button></div>`,(sh,close)=>{sh.querySelector('#no').onclick=close;sh.querySelector('#yes').onclick=()=>{localStorage.removeItem(KEY);S=blank();ob.step=0;close();scheduleLocal();render()}});
}

/* ---------- ルーティング ---------- */
const TITLES={today:'うごく習慣ラボ',progress:'記録',plan:'プラン',habit:'習慣度',settings:'設定'};
function go(t){tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();window.scrollTo(0,0)}
function render(){
  if(!S.onboarded)return renderOnboarding();
  $('#nav').classList.remove('hide');$('#topbar').classList.remove('hide');
  const ph=phase();$('#phaseBadge').textContent=ph.e+' '+ph.n;$('#pageTitle').textContent=TITLES[tab];
  ({today:renderToday,progress:renderProgress,plan:renderPlan,habit:renderHabit,settings:renderSettings})[tab]();
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');b&&go(b.dataset.tab)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.onboarded){applyPending();scheduleLocal();if(swReg&&swReg.active)swReg.active.postMessage('check');if(tab==='today'&&!document.querySelector('.modal'))render()}});

(async()=>{
  render();
  await registerSW();
  await applyPending();
  syncSchedule();scheduleLocal();
  if(S.onboarded&&tab==='today'&&!document.querySelector('.modal'))render();
  const act=new URLSearchParams(location.search).get('do');
  if(act){history.replaceState(null,'',location.pathname);handleAction(act)}
})();
</script>
